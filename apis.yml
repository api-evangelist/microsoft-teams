aid: microsoft-teams
name: Microsoft Teams
description: Microsoft Teams is a collaboration platform that combines workplace chat, meetings, file storage, and application
  integration. It provides APIs for building custom integrations, managing teams and channels, sending messages, scheduling
  meetings, and initiating calls through Microsoft Graph.
