    LifecycleNotification:
      name: lifecycleNotification
      title: Subscription lifecycle notification
      summary: |
        Subscription lifecycle event. The `lifecycleEvent` value is one of
        `reauthorizationRequired`, `subscriptionRemoved`, or `missed`.
        Subscribers must respond with HTTP 202 within 30 seconds.
      contentType: application/json
      tags:
        - name: lifecycle
      payload:
        $ref: '#/components/schemas/LifecycleNotificationCollection'
      examples:
        - name: reauthorizationRequired
          summary: Reauthorization required
          payload:
            value:
              - subscriptionId: 7c0d4e7f-1234-4abc-9def-1122334455aa
                subscriptionExpirationDateTime: '2019-03-20T11:00:00.0000000Z'
                tenantId: 72f988bf-86f1-41af-91ab-2d7cd011db47
                clientState: secretClientState
                lifecycleEvent: reauthorizationRequired

    ValidationRequest:
      name: validationRequest
      title: Subscription endpoint validation request
      summary: |
        Sent by Microsoft Graph with the `validationToken` query parameter
        when a subscription is created or updated. The endpoint must respond
        within 10 seconds with HTTP 200 and `text/plain` body equal to the
        URL-decoded `validationToken`.
      contentType: text/plain
      headers:
        type: object
        properties:
          Content-Type:
            type: string
            enum: [text/plain]
      payload:
        type: object
        properties:
          validationToken:
            type: string
            description: Token (passed as query parameter) that must be echoed back.

    MessageActivity:
      name: messageActivity
      title: Bot Framework message activity
      contentType: application/json
      tags:
        - name: bot-framework
        - name: message
      payload:
        $ref: '#/components/schemas/MessageActivity'

    MessageUpdateActivity:
      name: messageUpdateActivity
      title: Bot Framework messageUpdate activity
      summary: |
        Sent when a previously sent message is edited or restored from
        soft-delete. `channelData.eventType` is `editMessage` or
        `undeleteMessage`.
      contentType: application/json
      tags:
        - name: bot-framework
        - name: messageUpdate
      payload:
        $ref: '#/components/schemas/MessageUpdateActivity'

    MessageDeleteActivity:
      name: messageDeleteActivity
      title: Bot Framework messageDelete activity
      summary: |
        Sent when a message is soft-deleted. `channelData.eventType` is
        `softDeleteMessage`.
      contentType: application/json
      tags:
        - name: bot-framework
        - name: messageDelete
      payload:
        $ref: '#/components/schemas/MessageDeleteActivity'

    ConversationUpdateActivity:
      name: conversationUpdateActivity
      title: Bot Framework conversationUpdate activity
      summary: |
        Sent for membership and team/channel lifecycle changes. The
        `channelData.eventType` discriminator identifies the Teams-specific
        sub-event:
        `teamMemberAdded`, `teamMemberRemoved`, `teamRenamed`,
        `channelCreated`, `channelRenamed`, `channelDeleted`,
        `channelRestored`, `teamArchived`, `teamUnarchived`, `teamDeleted`,
        `teamHardDeleted`, `teamRestored`.
      contentType: application/json
      tags:
        - name: bot-framework
        - name: conversationUpdate
      payload:
        $ref: '#/components/schemas/ConversationUpdateActivity'
      examples:
        - name: teamMemberAdded
          summary: Bot added to a team
          payload:
            type: conversationUpdate
            membersAdded:
              - id: '28:f5d48856-5b42-41a0-8c3a-c5f944b679b0'
            timestamp: '2017-02-23T19:38:35.312Z'
            id: 'f:5f85c2ad'
            channelId: msteams
            serviceUrl: https://smba.trafficmanager.net/amer-client-ss.msg/
            from:
              id: '29:1I9Is_Sx0OIy2rQ7Xz1lcaPKlO9eqmBRTBuW6XzkFtcjqxTjPaCMij8BVMdBcL9L_RwWNJyAHFQb0TRzXgyQvA'
            conversation:
              isGroup: true
              conversationType: channel
              id: '19:efa9296d959346209fea44151c742e73@thread.skype'
            recipient:
              id: '28:f5d48856-5b42-41a0-8c3a-c5f944b679b0'
              name: SongsuggesterBot
            channelData:
              team:
                id: '19:efa9296d959346209fea44151c742e73@thread.skype'
              eventType: teamMemberAdded
              tenant:
                id: 72f988bf-86f1-41af-91ab-2d7cd011db47

    MessageReactionActivity:
      name: messageReactionActivity
      title: Bot Framework messageReaction activity
      summary: |
        Sent when a user adds or removes a reaction (like, heart, laugh,
        surprised, sad, angry, and other supported emoji reactions) to a
        message previously sent by the bot.
      contentType: application/json
      tags:
        - name: bot-framework
        - name: messageReaction
      payload:
        $ref: '#/components/schemas/MessageReactionActivity'

    InstallationUpdateActivity:
      name: installationUpdateActivity
      title: Bot Framework installationUpdate activity
      summary: |
        Sent when the bot is installed, uninstalled, or upgraded in a
        conversation thread. The `action` field is one of `add`, `remove`,
        `add-upgrade`, or `remove-upgrade`.
      contentType: application/json
      tags:
        - name: bot-framework
        - name: installationUpdate
      payload:
        $ref: '#/components/schemas/InstallationUpdateActivity'

    TypingActivity:
      name: typingActivity
      title: Bot Framework typing activity
      contentType: application/json
      tags:
        - name: bot-framework
        - name: typing
      payload:
        $ref: '#/components/schemas/TypingActivity'

    InvokeActivity:
      name: invokeActivity
      title: Bot Framework invoke activity
      summary: |
        Synchronous request from Teams that expects a response payload. The
        `name` discriminator identifies the invoke kind. Documented Teams
        invoke names include `composeExtension/query`,
        `composeExtension/queryLink`, `composeExtension/selectItem`,
        `composeExtension/submitAction`, `composeExtension/fetchTask`,
        `composeExtension/setting`, `composeExtension/onCardButtonClicked`,
        `composeExtension/anonymousQueryLink`, `task/fetch`, `task/submit`,
        `tab/fetch`, `tab/submit`, `adaptiveCard/action`, `message/submitAction`,
        `messageBack`, `signin/verifyState`, `signin/tokenExchange`,
        `fileConsent/invoke`, `actionableMessage/executeAction`,
        `handoff/action`, and `config/fetch`, `config/submit`.
      contentType: application/json
      tags:
        - name: bot-framework
        - name: invoke
      payload:
        $ref: '#/components/schemas/InvokeActivity'

    EventActivity:
      name: eventActivity
      title: Bot Framework event activity
      summary: |
        Asynchronous notification from Teams. Documented Teams event names
        include `application/vnd.microsoft.readReceipt`,
        `application/vnd.microsoft.meetingStart`,
        `application/vnd.microsoft.meetingEnd`,
        `application/vnd.microsoft.meetingParticipantJoin`,
        `application/vnd.microsoft.meetingParticipantLeave`, and
        `application/vnd.microsoft.botMessagePreview`.
      contentType: application/json
      tags:
        - name: bot-framework
        - name: event
      payload:
        $ref: '#/components/schemas/EventActivity'

  schemas:
    # -------- Graph change notification envelope --------
    ChangeNotificationCollection:
      type: object
      description: |
        Top-level payload delivered by Microsoft Graph to a `notificationUrl`.
        Contains a batch of `changeNotification` items and optional
        `validationTokens` used to verify authenticity when resource data is
        included.
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/ChangeNotification'
        validationTokens:
          type: array
          description: JWT tokens used to validate the notification when resource data is included.
          items:
            type: string
      required:
        - value

    ChangeNotification:
      type: object
      description: A single change notification item.
      properties:
        subscriptionId:
          type: string
          format: uuid
          description: ID of the subscription that generated the notification.
        subscriptionExpirationDateTime:
          type: string
          format: date-time
        changeType:
          type: string
          description: |
            Type of change. For Teams resources this is one of `created`,
            `updated`, or `deleted` (subscriptions may comma-combine values).
          enum:
            - created
            - updated
            - deleted
        clientState:
          type: string
          description: Client-supplied secret echoed back so the receiver can verify the notification.
        resource:
          type: string
          description: OData path of the resource that changed.
        resourceData:
          $ref: '#/components/schemas/ResourceData'
        encryptedContent:
          $ref: '#/components/schemas/EncryptedContent'
        tenantId:
          type: string
          format: uuid
      required:
        - subscriptionId
        - changeType
        - resource

    ResourceData:
      type: object
      properties:
        id:
          type: string
        '@odata.type':
          type: string
        '@odata.id':
          type: string
        '@odata.etag':
          type: string

    EncryptedContent:
      type: object
      description: |
        Present when `includeResourceData: true` is set on the subscription.
        The receiver decrypts `dataKey` with its private key, then uses the
        symmetric key to decrypt `data`.
      properties:
        data:
          type: string
          description: Base64-encoded AES-encrypted resource data.
        dataKey:
          type: string
          description: Base64-encoded RSA-encrypted symmetric AES key.
        encryptionCertificateId:
          type: string
        encryptionCertificateThumbprint:
          type: string

    LifecycleNotificationCollection:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleNotification'
        validationTokens:
          type: array
          items:
            type: string
      required:
        - value

    LifecycleNotification:
      type: object
      properties:
        subscriptionId:
          type: string
          format: uuid
        subscriptionExpirationDateTime:
          type: string
          format: date-time
        tenantId:
          type: string
          format: uuid
        clientState:
          type: string
        lifecycleEvent:
          type: string
          enum:
            - reauthorizationRequired
            - subscriptionRemoved
            - missed
      required:
        - subscriptionId
        - lifecycleEvent

    # -------- Bot Framework Activity base + variants --------
    ActivityBase:
      type: object
      description: Bot Framework Activity base properties.
      properties:
        type:
          type: string
          description: |
            Bot Framework activity type. For Teams the documented values
            include `message`, `messageUpdate`, `messageDelete`,
            `conversationUpdate`, `messageReaction`, `installationUpdate`,
            `typing`, `invoke`, `event`, `endOfConversation`, and
            `handoff`.
          enum:
            - message
            - messageUpdate
            - messageDelete
            - conversationUpdate
            - messageReaction
            - installationUpdate
            - typing
            - invoke
            - event
            - endOfConversation
            - handoff
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        localTimestamp:
          type: string
          format: date-time
        localTimezone:
          type: string
        channelId:
          type: string
          description: Always `msteams` for Teams-originated activities.
        serviceUrl:
          type: string
          description: |
            Region-specific Bot Connector service URL. Examples include
            `https://smba.trafficmanager.net/amer/`,
            `https://smba.trafficmanager.net/emea/`, and
            `https://smba.trafficmanager.net/apac/`.
        from:
          $ref: '#/components/schemas/ChannelAccount'
        recipient:
          $ref: '#/components/schemas/ChannelAccount'
        conversation:
          $ref: '#/components/schemas/ConversationAccount'
        replyToId:
          type: string
        locale:
          type: string
        entities:
          type: array
          items:
            type: object
        channelData:
          $ref: '#/components/schemas/TeamsChannelData'

    MessageActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          properties:
            type:
              type: string
              enum: [message]
            text:
              type: string
            textFormat:
              type: string
              enum: [plain, markdown, xml]
            attachmentLayout:
              type: string
              enum: [list, carousel]
            attachments:
              type: array
              items:
                type: object
            suggestedActions:
              type: object
            value:
              description: Arbitrary value (e.g. card action payload).
          required:
            - type

    MessageUpdateActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          properties:
            type:
              type: string
              enum: [messageUpdate]
            text:
              type: string
          required:
            - type

    MessageDeleteActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          properties:
            type:
              type: string
              enum: [messageDelete]
          required:
            - type

    ConversationUpdateActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          properties:
            type:
              type: string
              enum: [conversationUpdate]
            membersAdded:
              type: array
              items:
                $ref: '#/components/schemas/ChannelAccount'
            membersRemoved:
              type: array
              items:
                $ref: '#/components/schemas/ChannelAccount'
            topicName:
              type: string
            historyDisclosed:
              type: boolean
          required:
            - type

    MessageReactionActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          properties:
            type:
              type: string
              enum: [messageReaction]
            reactionsAdded:
              type: array
              items:
                $ref: '#/components/schemas/MessageReaction'
            reactionsRemoved:
              type: array
              items:
                $ref: '#/components/schemas/MessageReaction'
          required:
            - type

    InstallationUpdateActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          properties:
            type:
              type: string
              enum: [installationUpdate]
            action:
              type: string
              enum:
                - add
                - remove
                - add-upgrade
                - remove-upgrade
          required:
            - type
            - action

    TypingActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          properties:
            type:
              type: string
              enum: [typing]
          required:
            - type

    InvokeActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          properties:
            type:
              type: string
              enum: [invoke]
            name:
              type: string
              description: |
                Invoke name (Teams documented values, non-exhaustive):
                `composeExtension/query`, `composeExtension/queryLink`,
                `composeExtension/anonymousQueryLink`,
                `composeExtension/selectItem`,
                `composeExtension/submitAction`,
                `composeExtension/fetchTask`,
                `composeExtension/querySettingUrl`,
                `composeExtension/setting`,
                `composeExtension/onCardButtonClicked`,
                `task/fetch`, `task/submit`,
                `tab/fetch`, `tab/submit`,
                `adaptiveCard/action`,
                `message/submitAction`,
                `messageBack`,
                `signin/verifyState`, `signin/tokenExchange`,
                `fileConsent/invoke`,
                `actionableMessage/executeAction`,
                `handoff/action`,
                `config/fetch`, `config/submit`.
            value:
              description: Invoke-specific payload (varies by `name`).
          required:
            - type
            - name

    EventActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          properties:
            type:
              type: string
              enum: [event]
            name:
              type: string
              description: |
                Event name. Documented Teams event names include
                `application/vnd.microsoft.readReceipt`,
                `application/vnd.microsoft.meetingStart`,
                `application/vnd.microsoft.meetingEnd`,
                `application/vnd.microsoft.meetingParticipantJoin`,
                `application/vnd.microsoft.meetingParticipantLeave`,
                `application/vnd.microsoft.botMessagePreview`.
            value:
              description: Event-specific payload.
          required:
            - type
            - name

    # -------- Supporting types --------
    ChannelAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        aadObjectId:
          type: string
        role:
          type: string
          enum: [user, bot, skill]

    ConversationAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        conversationType:
          type: string
          enum:
            - personal
            - groupChat
            - channel
        tenantId:
          type: string
        isGroup:
          type: boolean

    MessageReaction:
      type: object
      properties:
        type:
          type: string
          description: |
            Reaction type. Documented Teams reactions include `like`, `heart`,
            `laugh`, `surprised`, `sad`, and `angry`. Custom emoji reactions
            may also appear.

    TeamsChannelData:
      type: object
      description: |
        Teams-specific `channelData` payload appended to most Bot Framework
        activities. The `eventType` discriminator identifies Teams
        sub-events on `conversationUpdate` and similar activities.
      properties:
        eventType:
          type: string
          description: Teams sub-event identifier.
          enum:
            - teamMemberAdded
            - teamMemberRemoved
            - teamRenamed
            - channelCreated
            - channelRenamed
            - channelDeleted
            - channelRestored
            - teamArchived
            - teamUnarchived
            - teamDeleted
            - teamHardDeleted
            - teamRestored
            - editMessage
            - undeleteMessage
            - softDeleteMessage
        team:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            aadGroupId:
              type: string
        channel:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        tenant:
          type: object
          properties:
            id:
              type: string
        meeting:
          type: object
          properties:
            id:
              type: string
        notification:
          type: object
          properties:
            alert:
              type: boolean
            alertInMeeting:
              type: boolean
            externalResourceUrl:
              type: string
        source:
          type:
            - object
            - 'null'
        settings:
          type: object
        onBehalfOf:
          type: array
          items:
            type: object
