naftiko: 1.0.0-alpha2
info:
  label: Microsoft Graph Teams API — Members
  description: 'Microsoft Graph Teams API — Members. 4 operations. Lead operation: Microsoft Teams List Team Members. Self-contained
    Naftiko capability covering one Microsoft Teams business surface.'
  tags:
  - Microsoft Teams
  - Members
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_TEAMS_API_KEY: MICROSOFT_TEAMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: graph-members
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Teams API — Members business capability. Self-contained, no shared references.
    resources:
    - name: teams-team-id-members
      path: /teams/{team-id}/members
      operations:
      - name: listteammembers
        method: GET
        description: Microsoft Teams List Team Members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team-id
          in: path
          type: string
          description: The unique identifier of the team.
          required: true
      - name: addteammember
        method: POST
        description: Microsoft Teams Add Team Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team-id
          in: path
          type: string
          description: The unique identifier of the team.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: teams-team-id-members-membership-id
      path: /teams/{team-id}/members/{membership-id}
      operations:
      - name: removeteammember
        method: DELETE
        description: Microsoft Teams Remove Team Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team-id
          in: path
          type: string
          description: The unique identifier of the team.
          required: true
        - name: membership-id
          in: path
          type: string
          description: The membership ID of the member.
          required: true
      - name: updateteammember
        method: PATCH
        description: Microsoft Teams Update Team Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team-id
          in: path
          type: string
          description: The unique identifier of the team.
          required: true
        - name: membership-id
          in: path
          type: string
          description: The membership ID of the member.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_TEAMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: graph-members-rest
    port: 8080
    description: REST adapter for Microsoft Graph Teams API — Members. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/teams/{team-id}/members
      name: teams-team-id-members
      description: REST surface for teams-team-id-members.
      operations:
      - method: GET
        name: listteammembers
        description: Microsoft Teams List Team Members
        call: graph-members.listteammembers
        with:
          team-id: rest.team-id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addteammember
        description: Microsoft Teams Add Team Member
        call: graph-members.addteammember
        with:
          team-id: rest.team-id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teams/{team-id}/members/{membership-id}
      name: teams-team-id-members-membership-id
      description: REST surface for teams-team-id-members-membership-id.
      operations:
      - method: DELETE
        name: removeteammember
        description: Microsoft Teams Remove Team Member
        call: graph-members.removeteammember
        with:
          team-id: rest.team-id
          membership-id: rest.membership-id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateteammember
        description: Microsoft Teams Update Team Member
        call: graph-members.updateteammember
        with:
          team-id: rest.team-id
          membership-id: rest.membership-id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graph-members-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Graph Teams API — Members. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-teams-list-team-members
      description: Microsoft Teams List Team Members
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graph-members.listteammembers
      with:
        team-id: tools.team-id
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-teams-add-team-member
      description: Microsoft Teams Add Team Member
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: graph-members.addteammember
      with:
        team-id: tools.team-id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-teams-remove-team-member
      description: Microsoft Teams Remove Team Member
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: graph-members.removeteammember
      with:
        team-id: tools.team-id
        membership-id: tools.membership-id
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-teams-update-team-member
      description: Microsoft Teams Update Team Member
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: graph-members.updateteammember
      with:
        team-id: tools.team-id
        membership-id: tools.membership-id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
