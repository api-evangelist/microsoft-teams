naftiko: 1.0.0-alpha2
info:
  label: Microsoft Graph Teams API — Channels
  description: 'Microsoft Graph Teams API — Channels. 2 operations. Lead operation: Microsoft Teams List Channels. Self-contained
    Naftiko capability covering one Microsoft Teams business surface.'
  tags:
  - Microsoft Teams
  - Channels
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_TEAMS_API_KEY: MICROSOFT_TEAMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: graph-channels
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Teams API — Channels business capability. Self-contained, no shared references.
    resources:
    - name: teams-team-id-channels
      path: /teams/{team-id}/channels
      operations:
      - name: listchannels
        method: GET
        description: Microsoft Teams List Channels
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team-id
          in: path
          type: string
          description: The unique identifier of the team.
          required: true
      - name: createchannel
        method: POST
        description: Microsoft Teams Create Channel
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team-id
          in: path
          type: string
          description: The unique identifier of the team.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_TEAMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: graph-channels-rest
    port: 8080
    description: REST adapter for Microsoft Graph Teams API — Channels. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/teams/{team-id}/channels
      name: teams-team-id-channels
      description: REST surface for teams-team-id-channels.
      operations:
      - method: GET
        name: listchannels
        description: Microsoft Teams List Channels
        call: graph-channels.listchannels
        with:
          team-id: rest.team-id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createchannel
        description: Microsoft Teams Create Channel
        call: graph-channels.createchannel
        with:
          team-id: rest.team-id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graph-channels-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Graph Teams API — Channels. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-teams-list-channels
      description: Microsoft Teams List Channels
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graph-channels.listchannels
      with:
        team-id: tools.team-id
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-teams-create-channel
      description: Microsoft Teams Create Channel
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: graph-channels.createchannel
      with:
        team-id: tools.team-id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
